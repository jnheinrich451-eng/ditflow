# READ-ONLY to Claude Code. Changes only via human-reviewed calibration report
# (CLAUDE.md §4).
#
# Every value below is provisional — pending calibration (Task 4 report on the
# three-clip calibration set). Values were moved verbatim from
# configs/stage_a.yaml (and A-COV constants from bundle.py) on 2026-08-02; the
# audit trail of how each provisional value was arrived at lives in the git
# history of configs/stage_a.yaml.

thresholds:
  # ---- validity factors (q gate, per track point) --------------------------
  tau_v: 0.005          # provisional — pending calibration (Task 4)
  tau_c: 0.5            # provisional — pending calibration (Task 4)

  # ---- A-G2: Eq(24) consistency -------------------------------------------
  # Gated statistics since Task 2 (clip-invariant): null = UNGATED — the gate
  # reports its numbers with pass=null until the human reviews the Task 4
  # calibration table and writes values here (CLAUDE.md §4).
  tau_g_rel: 0.15             # primary: median relative 3D residual ||X0-G·Xl||/max(Z,Zmin)
  a_g2_min_inlier_frac: 0.814  # secondary: share of valid points with rel residual < 5x clip median
  tau_g_px: 8.41        # LEGACY pixel median — histogram marker in viz ONLY,
                        # never gated after Task 2; provisional

  # ---- A-G2b: source-frame self-projection --------------------------------
  tau_g2b_px: 4       # provisional — pending calibration (Task 4)

  # ---- A-COV: valid-track coverage -----------------------------------------
  a_cov_min_tracks: 200 # provisional — pending calibration (Task 4)
  a_cov_min_frac: 0.9   # provisional — pending calibration (Task 4)

  # --- A-CLIP: clip-level consistency ----------------------------------------
  rho: 0.45
  tau_b: 0.02
  tau_z: 1.5
  tau_r: null
  tau_d: 0.15
  tau_x: null
  f_min: 20
  n_min: 10
  lambda_1: 1
  lambda_2: 1
  lambda_3: 1
  tau_r_floor_mult: 1.5   # per-clip tau_r = mult x de-gauged static-pair e_ij median
  tau_x_depth_frac: 0.6   # per-clip tau_x = frac x clip median depth
  fc_quiet_frac: 0.5
  fc_min_quiet: 50
  fc_compact_frac: 0.5
  fc_travel_floor_mult: 2.0
  fc_min_winner_frac: 0.05
  fc_min_winner_blob_overlap: 0.1
  fc_min_winner_core_overlap: 0.07
  
  # --- Stage C gates ---
  c_tau_iou: 0.12
  c_size_lo: 0.5
  c_size_hi: 4.0
  c_tau_temp: 0.8
  c_abs_area_max: 0.2

  # --- Module 2 / m2_a admission (consumer thresholds ONLY — producer parameters
  #     heading_L / weighting / traj_source stay in configs/stage_b5.yaml).
  #     ALL null = UNGATED: the reader records every statistic per clip with pass=null
  #     and refuses only on hard conditions (missing B.5 artifact, object absent at t_a,
  #     hash mismatch). Held-out validation is DEFERRED for lack of x0 footage
  #     (docs/CC-TASK-b5-heldout-validation.md; docs/report_b5_v12_sweep.md).
  #     sigma_theta does NOT separate correct from wrong headings (measured 2026-09-09:
  #     failures at 11.6/12.9 deg, a correct clip at 27.2 deg) — theta_max alone cannot
  #     be an admission gate; a companion gate (sigma_spec candidate) is unvalidated.
  #     Admission for Module 2 is NOT validated. Set from distributions after the
  #     held-out set, permissively (catch conditioning failures, not maximise accuracy).
  m2a_theta_max_deg: null       # heading sanity ceiling (must exceed 27.2 if ever set)
  m2a_kappa_min: null           # basis conditioning; derivation suggests 1/3 (sin 19.5 deg)
  m2a_planarity_min: null       # up-plane conditioning (B.5 already applies its ladder)
  m2a_spread_min: null
  m2a_mask_area_min_px: null    # spec v3 §13 "too few pixels" — 256^2 process px
  m2a_truncation_max: null      # fraction of mask pixels on the image border
  m2c_contact_step_max: null    # update to null
  m2d_polarity: near_bright
  m2d_e_loc_rel_max: 0.5      # ||delta|| / sqrt(A_obj); derived from failure semantics, 4x worst observed; UNVALIDATED (never fired)
  m2d_e_area_max: 0.693       # log 2; derived, 1.5x worst observed (265/human, size floor); UNVALIDATED
  m2d_heading: human          # no validated instrument; manual per spec §4.2
  m2d_eps_shape_max: null     # clip-level, from C1, not per-candidate

