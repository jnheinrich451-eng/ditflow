# Stage A central config — single source of truth (SKILL §1.4).
# Fields still wrapped in <...> are HUMAN DECISIONS: fill once, then freeze.
# config.py refuses to run steps that need an unfilled field.

repo:
  github_url: "https://github.com/jnheinrich451-eng/ditflow.git"  # cloned at session start
  hf_dataset_id: "John00451/camera-motion-transfer"                   # private HF dataset with reference clips

paths:
  drive_root: /content/drive/MyDrive/ditflow_extract
  cache_dir:  ${paths.drive_root}/cache/stage_a     # per-clip frozen-contract bundles (§6)
  viz_dir:    ${paths.drive_root}/viz/stage_a
  secrets_gh: /content/drive/MyDrive/secrets/gh_token.env
  secrets_hf: /content/drive/MyDrive/secrets/hf_token.env
  data_dir:   /content/data                         # local disk, NOT Drive (read speed)
  d4rt_dir:   /content/d4rt                         # model repo clone (bootstrap)
  ckpt_dir:   /content/ckpt                         # checkpoint download target (bootstrap)
  stage_b_cache: ${paths.drive_root}/cache/stage_b  # Stage B outputs (§9 contract)
  stage_b_viz:   ${paths.drive_root}/viz/stage_b
  stage_c_cache: ${paths.drive_root}/cache/stage_c  # Stage C finalized bundles (SKILL_stage_c_mask §7)
  stage_c_viz:   ${paths.drive_root}/viz/stage_c

d4rt:
  # Candidate repos (2026-07 survey; confirm choice with human, then freeze):
  #   https://github.com/Lijiaxin0111/Open-d4rt      <- has released HF checkpoints
  #   https://github.com/jiangyurong609/d4rt-pytorch <- documented query API, no checkpoints
  repo: "https://github.com/Lijiaxin0111/Open-d4rt"
  checkpoint: "Lijiaxin0111/OpenD4RT"               # HF model id (org/name) or absolute path
  dtype: float32                                    # probe ran fp32: 4.8 GB VRAM on L4, no need to quantize
  latent_cache_policy: reencode                     # resolved by probe P7 (encode 1.0s, F=0.044 GB)
  # PINS — HUMAN DECISION, fill from `python scripts/find_pins.py` on Colab.
  # Stage A refuses to run while any is '<...>'. commit = the Open-d4rt commit
  # recorded as model_commit in the validated bundles' provenance.json.
  # Filled 2026-09-22 from find_pins.py (126 validated bundles read):
  #   403290a in 121 bundles, bead824 in 5. bead824 is an ancestor; the diff
  #   (855894b, native aspect ratio) touches only infer_track_3d._infer_tracks
  #   and eval_track3d_in_worldtrack.py, neither called by d4rt_adapter.py
  #   (it imports _resize_video/_unwrap_state_dict + src.*, all unchanged), so
  #   both commits run identical code on this path. Majority commit chosen.
  commit: "403290a6e7ea6262a1f20f8c02d5461cd7b6c9b3"
  # 7099b1f is the only OpenD4RT revision containing checkpoint_subdir
  # (added 2026-05-18, no later commits): determined, not just date-inferred.
  checkpoint_revision: "7099b1fc760475de3b7409acd6b63f801b015d07"
  checkpoint_subdir: OpenD4RT_48CLIP_9Mix_NoCropAUG # the validated checkpoint (contract §3);
                                                    # only this folder is downloaded

sam2:                                               # hashed (config.py) -> a pin change re-runs A too:
                                                    # deliberate, the instrument is one unit
  # INFERRED: sam2 default-branch HEAD on the Stage C sign-off date
  # (2026-08-22); the validated install was an unpinned git HEAD. Confirm by
  # re-extracting a calibration clip and matching the Stage C qc statistics.
  git_commit: "2b90b9f5ceec907a1c18123530e92e794ad901a4"
  # main on 2026-08-22. sam2.1_hiera_base_plus.pt is byte-identical in both
  # repo revisions (sha256 a2345aed..., 323606802 B), so this pin is exact.
  weights_revision: "b7320756a13354e7530a63935656d35b2f91a290"

# ViPE (Stage A.5 bake-off) lives in configs/stage_a5.yaml per its SKILL §1.

video:
  process_height: 256                               # frozen by probe P5: model input is 256x256;
                                                    # resize factors go to provenance (§5 rule)
  max_frames: 81                                    # matches Wan clip length downstream; frames
                                                    # beyond clip_frames use window stitching
  fps_policy: keep                                  # resampling is out of Stage A scope
  depth_stride: 2                                   # depth queried on this stride then bilinearly
                                                    # upsampled to process res; recorded in
                                                    # provenance; set 1 for fully dense queries

# Gate thresholds live in configs/calibration.lock.yaml (READ-ONLY to Claude
# Code; CLAUDE.md §4). config.py merges that file into cfg["thresholds"] and
# includes it in the config hash. Only algorithm parameters remain here.
thresholds:
  anchor_stride: 8  # occupancy sampling stride at anchor discovery (SKILL §5);
                    # algorithm parameter, not a gate threshold

session:
  gpu: l4           # {l4 | a100_40 | a100_80}; bump only per §1.1 policy (P7 evidence first)
