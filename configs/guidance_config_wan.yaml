# DiTFlow guidance parameters for Wan2.1 T2V.
# Separate from configs/guidance_config.yaml so the CogVideoX baseline is untouched.

# --- Optimisation ---------------------------------------------------------
lr: [0.002, 0.001]          # LR range across guidance_timestep_range
optimization_steps: 5       # Optimisation steps per denoising step
guidance_timestep_range: [50, 40]
injection_timestep_range: null  # null follows guidance; [50, 20] injects at steps 0..29
lr_decay_steps: null         # null spans active guidance; fixed count enables equal-prefix comparisons

# --- Guidance placement ---------------------------------------------------
# CogVideoX used ~50% depth (20/42 for 5B, 15/30 for 2B). Same ratio here.
# These are starting points, NOT ported optima -- sweep them.
guidance_blocks_1_3b: [15]   # Wan2.1-T2V-1.3B has 30 blocks
guidance_blocks_14b: [20]    # Wan2.1-T2V-14B has 40 blocks
injection_blocks: [0]

# --- AMF ------------------------------------------------------------------
motion_temp: 2              # Softmax sharpening on attention logits.
                            # Wan applies RMSNorm to q/k (qk_norm=rms_norm_across_heads),
                            # so logit scale differs from CogVideoX -- retune this first.
threshloss: True            # Score only nonzero reference AMF, as upstream does.
                            # Same-position attention matches are not a physical
                            # static-background mask. Use --no_threshloss as an
                            # ablation; inspect actual retained locations first.
argmax_motion_flow: True    # Argmax the reference motion flow

# Reference-AMF outlier rejection. Defaults are OFF (null/mse), which reproduces
# the upstream filtering choice -- turn them on to A/B against it.
#
# Argmax can select unreliable correspondences in occluded or ambiguous regions.
# These filters are heuristics; large displacement can also be legitimate,
# particularly because the loss includes nonadjacent frame pairs.
flow_max_disp: null         # drop reference displacements above N PATCH units.
flow_min_conf: null         # drop rows whose peak softmax prob is below this,
                            # i.e. the correspondence is undetermined. Try
                            # 0.01-0.05; scale-dependent, so read the "keeps N%"
                            # line each run prints.
flow_loss: mse              # mse | huber
huber_delta: 2.0            # patch units; linear beyond this
checkpoint_amf: auto        # auto | true | false -- recompute frame-pair blocks in
                            # backward. 'auto' enables above 7 latent frames.
softmax_fp32: True          # Softmax AMF in fp32 (reference does it in bf16)

# --- Sampling -------------------------------------------------------------
num_inference_steps: 50
guidance_scale: 5.0         # Wan2.1 default (CogVideoX used 7)
scheduler: unipc            # unipc | flowmatch
flow_shift: 3.0             # 3.0 for 480P, 5.0 for 720P
height: 480
width: 832                  # Wan2.1 480P native aspect
num_frames: 21              # Must be 4k+1, and must not exceed the reference
                            # video's frame count. The bundled assets/*.mp4 are
                            # 24 frames, so 21 is the largest legal value for
                            # them. 21 -> 6 latent frames, which is exactly the
                            # working point DiTFlow used on CogVideoX.
                            # Longer reference clips: 33 -> 9, 81 -> 21.

# --- Misc -----------------------------------------------------------------
enable_gradient_checkpointing: True
enable_model_cpu_offload: False   # Set True for <24GB VRAM
prop_motion: 0.04                 # MOFT % channels
source_prompt: ""
device: 'cuda'
